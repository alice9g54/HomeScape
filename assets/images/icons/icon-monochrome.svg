<?xml version="1.0" encoding="UTF-8"?>
<!--
  ============================================================
  HOMESCAPE - MONOCHROME ICON (SVG)
  Version: 2.0.0
  Purpose: Themed icons for OS that support monochrome
  Note: Single color, transparent background
  ============================================================
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  
  <!-- House icon - single black color -->
  <g transform="translate(256, 235)" fill="#000000" stroke="#000000">
    
    <!-- Chimney -->
    <rect x="60" y="-95" width="32" height="70" 
          fill="#000000" 
          stroke="#000000" 
          stroke-width="6" 
          rx="4" ry="4"/>
    
    <!-- Roof -->
    <path d="M 0,-125 L -135,-15 L -135,5 L 0,-105 L 135,5 L 135,-15 Z" 
          fill="#000000" 
          stroke="#000000" 
          stroke-width="8" 
          stroke-linejoin="round"/>
    
    <!-- Main house (outlined) -->
    <path d="M -105,-5 L 105,-5 L 105,140 L -105,140 Z M -85,15 L 85,15 L 85,120 L -85,120 Z" 
          fill-rule="evenodd" 
          fill="#000000"/>
    
    <!-- Door (cutout) -->
    <rect x="-28" y="55" width="56" height="85" 
          fill="#ffffff" 
          rx="8" ry="8"/>
    
    <!-- Left window -->
    <rect x="-85" y="15" width="50" height="60" 
          fill="#ffffff" 
          rx="5" ry="5"/>
    <line x1="-60" y1="15" x2="-60" y2="75" stroke="#000000" stroke-width="4"/>
    <line x1="-85" y1="45" x2="-35" y2="45" stroke="#000000" stroke-width="4"/>
    
    <!-- Right window -->
    <rect x="35" y="15" width="50" height="60" 
          fill="#ffffff" 
          rx="5" ry="5"/>
    <line x1="60" y1="15" x2="60" y2="75" stroke="#000000" stroke-width="4"/>
    <line x1="35" y1="45" x2="85" y2="45" stroke="#000000" stroke-width="4"/>
  </g>
  
  <!-- Monogram -->
  <text x="256" y="455" 
        font-family="'Playfair Display', Georgia, serif" 
        font-size="56" 
        font-weight="900" 
        fill="#000000" 
        text-anchor="middle"
        letter-spacing="4">
    HS
  </text>
  
</svg>