<?xml version="1.0" encoding="UTF-8"?>
<!--
  ============================================================
  HOMESCAPE - MASTER ICON (SVG)
  Version: 2.0.0
  Purpose: Source vector for all PNG icons
  Design: Modern house with premium green gradient
  ============================================================
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  
  <!-- Definitions -->
  <defs>
    <!-- Background gradient -->
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#047857;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#065f46;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#022c22;stop-opacity:1" />
    </linearGradient>
    
    <!-- Roof gradient -->
    <linearGradient id="roofGradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#6ee7b7;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#34d399;stop-opacity:1" />
    </linearGradient>
    
    <!-- Window glow -->
    <radialGradient id="windowGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" style="stop-color:#34d399;stop-opacity:0.6" />
      <stop offset="100%" style="stop-color:#34d399;stop-opacity:0" />
    </radialGradient>
    
    <!-- Drop shadow -->
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="6"/>
      <feOffset dx="0" dy="4" result="offsetblur"/>
      <feComponentTransfer>
        <feFuncA type="linear" slope="0.3"/>
      </feComponentTransfer>
      <feMerge>
        <feMergeNode/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  
  <!-- Rounded square background -->
  <rect width="512" height="512" rx="112" ry="112" fill="url(#bgGradient)"/>
  
  <!-- Subtle inner glow border -->
  <rect x="8" y="8" width="496" height="496" rx="104" ry="104" 
        fill="none" 
        stroke="rgba(52, 211, 153, 0.15)" 
        stroke-width="4"/>
  
  <!-- House icon -->
  <g transform="translate(256, 235)" filter="url(#shadow)">
    
    <!-- Chimney (behind roof) -->
    <rect x="60" y="-95" width="32" height="70" 
          fill="#022c22" 
          stroke="#34d399" 
          stroke-width="6" 
          rx="4" ry="4"/>
    
    <!-- Chimney smoke -->
    <circle cx="76" cy="-110" r="10" fill="#6ee7b7" opacity="0.5"/>
    <circle cx="92" cy="-130" r="14" fill="#6ee7b7" opacity="0.35"/>
    <circle cx="110" cy="-152" r="8" fill="#6ee7b7" opacity="0.2"/>
    
    <!-- Roof -->
    <path d="M 0,-125 L -135,-15 L -135,5 L 0,-105 L 135,5 L 135,-15 Z" 
          fill="url(#roofGradient)" 
          stroke="#34d399" 
          stroke-width="8" 
          stroke-linejoin="round"
          stroke-linecap="round"/>
    
    <!-- Main house body -->
    <rect x="-105" y="-5" width="210" height="145" 
          fill="#ffffff" 
          stroke="#34d399" 
          stroke-width="8" 
          rx="10" ry="10"/>
    
    <!-- Door -->
    <rect x="-28" y="55" width="56" height="85" 
          fill="#047857" 
          stroke="#022c22" 
          stroke-width="5" 
          rx="8" ry="8"/>
    
    <!-- Door handle -->
    <circle cx="18" cy="100" r="4" fill="#6ee7b7"/>
    
    <!-- Door knob line -->
    <line x1="-28" y1="55" x2="28" y2="55" stroke="#022c22" stroke-width="3" opacity="0.3"/>
    
    <!-- Left window -->
    <rect x="-85" y="15" width="50" height="60" 
          fill="#022c22" 
          stroke="#34d399" 
          stroke-width="5" 
          rx="5" ry="5"/>
    <line x1="-60" y1="15" x2="-60" y2="75" stroke="#34d399" stroke-width="4"/>
    <line x1="-85" y1="45" x2="-35" y2="45" stroke="#34d399" stroke-width="4"/>
    <!-- Window glow -->
    <ellipse cx="-60" cy="45" rx="20" ry="25" fill="url(#windowGlow)" opacity="0.5"/>
    
    <!-- Right window -->
    <rect x="35" y="15" width="50" height="60" 
          fill="#022c22" 
          stroke="#34d399" 
          stroke-width="5" 
          rx="5" ry="5"/>
    <line x1="60" y1="15" x2="60" y2="75" stroke="#34d399" stroke-width="4"/>
    <line x1="35" y1="45" x2="85" y2="45" stroke="#34d399" stroke-width="4"/>
    <!-- Window glow -->
    <ellipse cx="60" cy="45" rx="20" ry="25" fill="url(#windowGlow)" opacity="0.5"/>
  </g>
  
  <!-- Bottom monogram "HS" -->
  <g transform="translate(256, 448)">
    <!-- Background pill -->
    <rect x="-55" y="-30" width="110" height="60" rx="30" ry="30" 
          fill="rgba(255, 255, 255, 0.1)" 
          stroke="rgba(52, 211, 153, 0.3)" 
          stroke-width="2"/>
    
    <!-- Text -->
    <text x="0" y="15" 
          font-family="'Playfair Display', Georgia, serif" 
          font-size="42" 
          font-weight="900" 
          fill="#ffffff" 
          text-anchor="middle"
          letter-spacing="3">
      HS
    </text>
  </g>
  
  <!-- Decorative dots bottom -->
  <circle cx="220" cy="480" r="3" fill="#34d399" opacity="0.6"/>
  <circle cx="256" cy="485" r="4" fill="#34d399"/>
  <circle cx="292" cy="480" r="3" fill="#34d399" opacity="0.6"/>
  
</svg>